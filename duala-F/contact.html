<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projects.css">
    <title>Get Involved</title>
    <style>
    body {
    text-align: center;
    }

    form {
    display: inline-block;
    padding: 1em;
    border: 1px solid #ccc;
    border-radius: 1em;
    }

    p + p {
    margin-top: 1em;
    }

    label {
    display: inline-block;
    min-width: 90px;
    text-align: right;
    }

    input,
    textarea {
    font: 1em sans-serif;
    width: 300px;
    box-sizing: border-box;
    border: 1px solid #999;
    }

    input:focus,
    textarea:focus {
    outline-style: solid;
    outline-color: #000;
    }

    textarea {
    vertical-align: top;
    height: 5em;
    }

    .button {
    padding-left: 90px; 
    }

    button {
    margin-left: 0.5em;
    }
    #form{
        padding: 45px;
    }
    #feedback {
    background-color: white;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: .5em;
    display: none;      
}
.moveDown {
    margin-top: 3em;
}
    </style>
</head>

<body>
        <div id="content">
        <header>
            <a class="logo-link" href="index.html">
                <img class="logo" src="images/dual_foundation-logo.png" alt="Duala Foundation Logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="#">About Us</a>
                <a href="projects.html">Projects</a>
                <a href="#" class="contact">Get Involved</a>
            </nav>
        </header>
        <main id="form">
            <div id="feedback"></div>
            <form action="forms/#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user_name">
                </p>
                <p>
                    <label for="mail">Email:</label>
                    <input type="text" id="mail" name="user_email">
                </p>
                <p>
                    <label for="msg">Commitment</label>
                    <textarea name="user_message" id="msg"></textarea>
                </p>
                <p class="button">
                    <button type="submit">Send Your Message</button>
                </p>
            </form>
        </main>
        <footer>
            <a class="logo-link" href="index.html">
                <img class="logo" src="images/dual_foundation-logo.png" alt="Duala Foundation Logo">
            </a>
            <p>Duala Foundation &copy; 2025. All rights reserved</p>
            <p>Empowering communities</p>
            <p><a href="site-plan.html">Site Plan</a></p>
            <p>Follow us on:</p>
            <div class="social">
                <a href="https://facebook.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/facebook.png" alt="facebook icon">
                </a>
                <a href="https://twitter.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/twitter.png" alt="twitter icon">
                </a>
                <a href="https://instagram.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/instagram.png" alt="instagram icon">
                </a>
            </div> 
        </footer>
</body>
</html>
