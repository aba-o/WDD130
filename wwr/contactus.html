<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whitewater Rafting Vacations | Dry Oar Boating | Contact Us</title>
    <link rel="stylesheet" href="FAQ.css">
    <style>
    body {
    text-align: center;
    }

    form {
    display: inline-block;
    padding: 1em;
    border: 1px solid #ccc;
    border-radius: 1em;
    }

    p + p {
    margin-top: 1em;
    }

    label {
    display: inline-block;
    min-width: 90px;
    text-align: right;
    }

    input,
    textarea {
    font: 1em sans-serif;
    width: 300px;
    box-sizing: border-box;
    border: 1px solid #999;
    }

    input:focus,
    textarea:focus {
    outline-style: solid;
    outline-color: #000;
    }

    textarea {
    vertical-align: top;
    height: 5em;
    }

    .button {
    padding-left: 90px; 
    }

    button {
    margin-left: 0.5em;
    }
    #form{
        padding: 45px;
    }
    #feedback {
    background-color: white;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: .5em;
    display: none;      
}
.moveDown {
    margin-top: 3em;
}
    </style>
</head>
<body>
    <div id="content">
        <header id="head">
            <a class="logo_link" href="index.html">
                <img class="logo" src="images/WhiteWater.png" alt="Dry Oar Logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="FAQ.html">FAQ</a>
                <a href="site-plan-rafting.html">Site Plan</a>
                <a href="contactus.html">Contact Us</a>
            </nav>
        </header>
        <main id="form">
            <div id="feedback"></div>
            <form action="forms/#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user_name">
                </p>
                <p>
                    <label for="mail">Email:</label>
                    <input type="text" id="mail" name="user_email">
                </p>
                <p>
                    <label for="msg">Message</label>
                    <textarea name="user_message" id="msg"></textarea>
                </p>
                <p class="button">
                    <button type="submit">Send Your Message</button>
                </p>
            </form>
        </main>
        <footer>
            <a class="logo_link" href="index.html">
                <img class="logo" src="images/logo.png" alt="Dry Oar Logo">
            </a>
            <p>Dry Oar &copy; 2025 - Aba Otchere. All rights reserved</p>
            <p><a href="site-plan-rafting.html">Site Plan</a></p>
            <p><a href="contactus.html">Contact Us</a></p>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of service</a>
            <div class="social">
                <a href="https://facebook.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/facebook.png" alt="facebook icon">
                </a>
                <a href="https://twitter.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/twitter.png" alt="twitter icon">
                </a>
                <a href="https://instagram.com" target="_blank">
                    <img src="https://byui-wdd.github.io/wdd130/rafting_images/instagram.png" alt="instagram icon"><br>
                </a>
            </div>
        </footer>
    </div>
    <script>
    const feedbackElement = document.getElementById('feedback');
    const formElement = document.forms[0];
    formElement.addEventListener('submit', function(e) {
        e.preventDefault();
        feedbackElement.innerHTML = 'Hello '+ formElement.user_name.value +'! Thank you for your message. We will get back with you as soon as possible!';
        feedbackElement.style.display = "block";
        document.body.classList.toggle('moveDown');
    });
</script>
</body>
</html>
